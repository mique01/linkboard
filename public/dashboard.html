<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LINKBOARD</title>
  <script>
    (function () {
      const CANONICAL_ORIGIN = 'https://linkboard-m5wi.vercel.app';
      const DASHBOARD_PATH = '/dashboard.html';
      const APP_VERSION = '20260727c';

      try {
        const current = new URL(window.location.href);
        const onPreviewDomain =
          current.hostname.endsWith('.vercel.app') &&
          current.hostname !== 'linkboard-m5wi.vercel.app';

        if (onPreviewDomain || current.pathname !== DASHBOARD_PATH) {
          const target = new URL(DASHBOARD_PATH, CANONICAL_ORIGIN);
          target.searchParams.set('v', APP_VERSION);
          window.location.replace(target.toString());
          return;
        }

        if (current.searchParams.get('v') !== APP_VERSION) {
          current.searchParams.set('v', APP_VERSION);
          window.location.replace(current.toString());
        }
      } catch {}
    })();
  </script>
  <link rel="manifest" href="/manifest.json?v=20260727" />
  <meta name="theme-color" content="#1b1f24" />
  <link rel="apple-touch-icon" href="/icon.png" />
  <style>
    /* ============================================================
       RESET & BASE
    ============================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #1b1f24;
      --surface:    #232932;
      --surface2:   #2d343f;
      --border:     #434d5b;
      --border-hi:  #5b6778;
      --text:       #eef2f7;
      --text-dim:   #c8d0db;
      --text-muted: #8b93a3;
      --accent:     #c8a84b;   /* amber / terminal gold */
      --accent-dim: #8a7030;
      --danger:     #c0392b;
      --radius:     3px;
      --font-mono:  'Courier New', Courier, monospace;
      --font-ui:    'Inter', system-ui, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ============================================================
       SCROLLBAR
    ============================================================ */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 3px; }

    /* ============================================================
       HEADER / TOPBAR
    ============================================================ */
    #topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 20px;
      height: 56px;
    }

    #topbar .logo {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: var(--accent);
      white-space: nowrap;
      user-select: none;
    }
    .brand-nav {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-link {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px 8px 0 0;
      border-bottom-color: transparent;
      padding: 12px 22px 11px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.16em;
      color: rgba(200,168,75,.92);
      cursor: pointer;
      text-transform: uppercase;
      transition: color .15s, border-color .15s, background .15s;
      position: relative;
      top: 7px;
    }
    .brand-link:hover,
    .brand-link.active {
      color: var(--accent);
      border-color: var(--border-hi);
      background: var(--bg);
    }

    #topbar .divider {
      width: 1px;
      height: 20px;
      background: var(--border);
      flex-shrink: 0;
    }

    /* Search bar */
    #search-wrap {
      flex: 1;
      max-width: 340px;
      position: relative;
    }
    #search-wrap svg {
      position: absolute;
      left: 9px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      pointer-events: none;
    }
    #search {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 6px 10px 6px 30px;
      outline: none;
      transition: border-color .15s;
    }
    #search::placeholder { color: var(--text-muted); }
    #search:focus { border-color: var(--accent-dim); }

    #topbar .spacer { flex: 1; }

    /* Add section button */
    #btn-add-section {
      display: flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: 1px solid var(--accent-dim);
      border-radius: var(--radius);
      color: var(--accent);
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: .08em;
      padding: 5px 12px;
      cursor: pointer;
      transition: background .15s, border-color .15s;
      white-space: nowrap;
    }
    #btn-add-section:hover {
      background: rgba(200,168,75,.08);
      border-color: var(--accent);
    }
    #btn-add-section svg { flex-shrink: 0; }

    /* ============================================================
       MAIN LAYOUT
    ============================================================ */
    #main {
      padding: 24px 20px 60px;
    }
    #planner-view {
      display: none;
    }
    .planner-shell {
      display: flex;
      justify-content: center;
      padding-top: 12px;
    }
    .planner-card {
      width: min(840px, 100%);
      min-height: 280px;
    }
    .planner-card .section-header {
      cursor: default;
      padding: 14px 18px;
    }
    .planner-list {
      display: flex;
      flex-direction: column;
    }
    .planner-empty {
      min-height: 180px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-align: center;
      color: var(--text-dim);
      padding: 32px 20px;
    }
    .planner-empty strong {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: .12em;
      color: var(--text);
    }
    .planner-create-inline {
      width: 100%;
      border: none;
      border-top: 1px solid var(--border);
      background: transparent;
      color: var(--accent);
      font-family: var(--font-ui);
      font-size: 14px;
      text-align: left;
      padding: 18px 20px;
      cursor: pointer;
      transition: background .15s;
    }
    .planner-create-inline:hover {
      background: rgba(200,168,75,.06);
    }
    .planner-row {
      display: flex;
      align-items: center;
      gap: 16px;
      min-height: 60px;
      padding: 0 20px;
      border-top: 1px solid var(--border);
    }
    .planner-row:hover {
      background: rgba(255,255,255,.015);
    }
    .planner-row-main {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
      flex: 1;
    }
    .planner-row-meta {
      color: var(--text-dim);
      font-size: 15px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .planner-row-icon {
      width: 18px;
      height: 18px;
      color: var(--accent);
      flex-shrink: 0;
    }
    .planner-row-title {
      font-size: 18px;
      color: var(--text);
      letter-spacing: .01em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .planner-row-delete {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      padding: 6px;
      margin-right: -6px;
      transition: color .15s;
    }
    .planner-row-delete:hover {
      color: var(--danger);
    }
    .planner-task-check {
      width: 28px;
      height: 28px;
      appearance: none;
      -webkit-appearance: none;
      border: 2px solid var(--border-hi);
      border-radius: 4px;
      background: transparent;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
    }
    .planner-task-check:checked {
      border-color: var(--accent);
      background: rgba(200,168,75,.12);
    }
    .planner-task-check:checked::after {
      content: '';
      position: absolute;
      left: 8px;
      top: 3px;
      width: 7px;
      height: 14px;
      border: solid var(--accent);
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }
    .planner-form {
      border-top: 1px solid var(--border);
      padding: 18px 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .planner-form-title {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: .12em;
      color: var(--accent);
    }
    .planner-form-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* ============================================================
       EMPTY STATE
    ============================================================ */
    #empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 100px 20px;
      color: var(--text-dim);
      text-align: center;
    }
    #empty-state .es-icon {
      width: 48px;
      height: 48px;
      border: 1px solid var(--border);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--border-hi);
    }
    #empty-state h2 {
      font-family: var(--font-mono);
      font-size: 13px;
      letter-spacing: .12em;
      color: var(--text-dim);
    }
    #empty-state p {
      font-size: 12px;
      max-width: 280px;
    }
    #empty-state button {
      background: transparent;
      border: 1px solid var(--accent-dim);
      border-radius: var(--radius);
      color: var(--accent);
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 7px 18px;
      cursor: pointer;
      letter-spacing: .08em;
      transition: background .15s;
    }
    #empty-state button:hover { background: rgba(200,168,75,.08); }

    /* ============================================================
       SECTIONS GRID
    ============================================================ */
    #sections-grid {
      display: grid;
      /* auto-fill columns, min 280px wide */
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      align-items: start;
    }

    /* ============================================================
       SECTION CARD
    ============================================================ */
    .section-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      transition: border-color .15s;
      cursor: default;
    }
    .section-card.drag-over {
      border-color: var(--accent-dim);
      background: var(--surface2);
    }
    .section-card.dragging {
      opacity: .45;
    }

    /* Section header */
    .section-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      cursor: grab;
      user-select: none;
    }
    .section-header:active { cursor: grabbing; }

    .section-drag-handle {
      color: var(--text-muted);
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }

    .section-title {
      flex: 1;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: .12em;
      color: var(--accent);
      text-transform: uppercase;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .section-title-input {
      flex: 1;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--accent-dim);
      outline: none;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: .12em;
      color: var(--accent);
      text-transform: uppercase;
      padding: 1px 0;
      min-width: 0;
    }

    .section-actions {
      display: flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }

    /* Icon buttons (edit/delete inside sections) */
    .icon-btn {
      background: none;
      border: none;
      padding: 4px;
      border-radius: var(--radius);
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: color .12s, background .12s;
      line-height: 0;
    }
    .icon-btn:hover { color: var(--text-dim); background: var(--surface2); }
    .icon-btn.danger:hover { color: var(--danger); background: rgba(192,57,43,.1); }

    /* Links list */
    .links-list {
      display: flex;
      flex-direction: column;
      gap: 1px;
      padding: 6px;
      min-height: 8px;
    }

    /* Link tile */
    .link-tile {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: var(--radius);
      border: 1px solid transparent;
      background: var(--surface2);
      transition: border-color .12s, background .12s;
      cursor: grab;
      group: true;
    }
    .link-tile:active { cursor: grabbing; }
    .link-tile.dragging { opacity: .4; }
    .link-tile.drag-over-top {
      border-top-color: var(--accent-dim);
    }
    .link-tile.drag-over-bottom {
      border-bottom-color: var(--accent-dim);
    }

    .link-tile:hover { border-color: var(--border-hi); }

    .link-favicon {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      border-radius: 2px;
      object-fit: cover;
    }

    .link-title {
      flex: 1;
      font-size: 12px;
      color: var(--text);
      text-decoration: none;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .link-title:hover { color: var(--accent); }

    .link-actions {
      display: flex;
      align-items: center;
      gap: 2px;
      opacity: 0;
      transition: opacity .12s;
      flex-shrink: 0;
    }
    .link-tile:hover .link-actions { opacity: 1; }

    /* Add link button at bottom of section */
    .btn-add-link {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      background: none;
      border: none;
      border-top: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 11px;
      font-family: var(--font-mono);
      letter-spacing: .06em;
      padding: 8px 12px;
      cursor: pointer;
      text-align: left;
      border-radius: 0 0 var(--radius) var(--radius);
      transition: color .12s, background .12s;
    }
    .btn-add-link:hover {
      color: var(--text-dim);
      background: var(--surface2);
    }

    /* ============================================================
       MODAL / DIALOG
    ============================================================ */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(12,14,18,.72);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: fadeIn .1s ease;
    }
    @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border-hi);
      border-radius: var(--radius);
      width: 100%;
      max-width: 400px;
      padding: 24px;
      animation: slideUp .15s ease;
    }
    .panel-window {
      background: var(--surface);
      border: 1px solid var(--border-hi);
      border-radius: var(--radius);
      width: min(420px, calc(100vw - 24px));
      max-height: min(78vh, 760px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: slideUp .15s ease;
    }
    .panel-window .section-header {
      cursor: default;
    }
    .panel-window-body {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 140px;
    }
    .panel-window-footer {
      border-top: 1px solid var(--border);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: var(--surface);
    }
    .panel-window-meta {
      font-size: 12px;
      color: var(--text-dim);
      line-height: 1.55;
    }
    .panel-window-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .window-create-btn {
      background: rgba(200,168,75,.1);
      border: 1px solid var(--accent-dim);
      border-radius: var(--radius);
      color: var(--accent);
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: .08em;
      padding: 7px 10px;
      cursor: pointer;
      transition: background .12s;
    }
    .window-create-btn:hover {
      background: rgba(200,168,75,.2);
    }
    .window-create-btn.secondary {
      background: transparent;
      border-color: var(--border-hi);
      color: var(--text-dim);
    }
    .window-create-btn.secondary:hover {
      background: var(--surface2);
      border-color: var(--text-dim);
      color: var(--text);
    }
    @keyframes slideUp { from { transform:translateY(8px); opacity:0; } to { transform:translateY(0); opacity:1; } }

    .modal h3 {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: .14em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .form-field {
      margin-bottom: 14px;
    }
    .form-field label {
      display: block;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: .1em;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .form-field input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 8px 10px;
      outline: none;
      transition: border-color .15s;
    }
    .form-field input:focus { border-color: var(--accent-dim); }
    .form-field input::placeholder { color: var(--text-muted); }

    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 20px;
    }

    .btn-cancel {
      background: none;
      border: 1px solid var(--border-hi);
      border-radius: var(--radius);
      color: var(--text-dim);
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 7px 16px;
      cursor: pointer;
      transition: border-color .12s, color .12s;
    }
    .btn-cancel:hover { border-color: var(--text-dim); color: var(--text); }

    .btn-confirm {
      background: rgba(200,168,75,.12);
      border: 1px solid var(--accent-dim);
      border-radius: var(--radius);
      color: var(--accent);
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 7px 16px;
      cursor: pointer;
      transition: background .12s, border-color .12s;
    }
    .btn-confirm:hover { background: rgba(200,168,75,.22); border-color: var(--accent); }

    /* Confirm delete modal */
    .modal .confirm-text {
      font-size: 13px;
      color: var(--text-dim);
      margin-bottom: 4px;
    }
    .modal .confirm-name {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text);
      margin-top: 6px;
    }
    .btn-danger {
      background: rgba(192,57,43,.1);
      border: 1px solid rgba(192,57,43,.4);
      border-radius: var(--radius);
      color: var(--danger);
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 7px 16px;
      cursor: pointer;
      transition: background .12s;
    }
    .btn-danger:hover { background: rgba(192,57,43,.22); }

    /* ============================================================
       NO RESULTS
    ============================================================ */
    #no-results {
      display: none;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-muted);
      padding: 40px 0;
      text-align: center;
      letter-spacing: .06em;
    }

    /* ============================================================
       STATUS BAR
    ============================================================ */
    #statusbar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 20px;
      height: 28px;
      z-index: 50;
    }
    .statusbar-item {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: .06em;
    }
    .statusbar-item span { color: var(--text-dim); }

    /* ============================================================
       TOPBAR UTILITY BUTTONS (notifications / install)
    ============================================================ */
    .topbar-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: .07em;
      padding: 5px 10px;
      cursor: pointer;
      white-space: nowrap;
      transition: border-color .15s, color .15s;
    }
    .topbar-btn:hover {
      border-color: var(--border-hi);
      color: var(--text-dim);
    }
    .topbar-btn.active {
      border-color: var(--accent-dim);
      color: var(--accent);
    }
    #btn-install { display: none; } /* shown only when install prompt available */

    /* Reminder badge on topbar button */
    .reminder-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      background: var(--accent);
      color: #000;
      border-radius: 8px;
      font-size: 9px;
      font-weight: 700;
      line-height: 1;
    }

    /* ============================================================
       LEGACY PANEL
    ============================================================ */
    #reminders-panel {
      display: none;
    }

    .rp-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .rp-header h2 {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: .14em;
      color: var(--accent);
      text-transform: uppercase;
    }

    .rp-body {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .rp-empty {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
      padding: 32px 0;
      letter-spacing: .06em;
    }
    .rp-section-title {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: .12em;
      color: var(--text-dim);
      margin-bottom: 6px;
    }
    .rp-section-block {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* Individual reminder item */
    .reminder-item {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: border-color .12s;
    }
    .reminder-item.fired {
      border-color: var(--accent-dim);
      opacity: .55;
    }
    .reminder-item-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }
    .reminder-main {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }
    .reminder-check {
      width: 14px;
      height: 14px;
      margin-top: 2px;
      flex-shrink: 0;
      cursor: pointer;
      accent-color: var(--accent);
    }
    .reminder-title {
      font-size: 12px;
      color: var(--text);
      font-weight: 500;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .reminder-desc {
      font-size: 11px;
      color: var(--text-dim);
      line-height: 1.4;
    }
    .reminder-time {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .reminder-fired-label {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--accent-dim);
      letter-spacing: .07em;
    }

    /* Add reminder form at bottom of panel */
    .rp-add-form {
      border-top: 1px solid var(--border);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }
    .rp-add-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .rp-add-group + .rp-add-group {
      border-top: 1px solid var(--border);
      padding-top: 10px;
      margin-top: 2px;
    }
    .rp-add-form .rp-form-title {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: .1em;
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .rp-input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 7px 9px;
      outline: none;
      transition: border-color .15s;
    }
    .rp-input:focus { border-color: var(--accent-dim); }
    .rp-input::placeholder { color: var(--text-muted); }

    .rp-add-btn {
      background: rgba(200,168,75,.1);
      border: 1px solid var(--accent-dim);
      border-radius: var(--radius);
      color: var(--accent);
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: .08em;
      padding: 7px 10px;
      cursor: pointer;
      transition: background .12s;
    }
    .rp-add-btn:hover { background: rgba(200,168,75,.2); }
    .rp-form-layout {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* ============================================================
       CALENDAR
    ============================================================ */
    .calendar-shell { max-width: 1320px; margin: 0 auto; }
    .calendar-toolbar {
      display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
      padding: 12px 14px; background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--radius);
    }
    .calendar-title {
      flex: 1; font-family: var(--font-mono); font-size: 14px;
      letter-spacing: .12em; text-transform: uppercase;
    }
    .calendar-account { color: var(--text-muted); font: 10px var(--font-mono); }
    .calendar-btn {
      display: inline-flex; align-items: center; justify-content: center;
      border: 1px solid var(--border); background: var(--surface2);
      color: var(--text-dim); min-height: 30px; padding: 5px 10px;
      border-radius: var(--radius); font: 10px var(--font-mono);
      letter-spacing: .06em; cursor: pointer; text-decoration: none;
    }
    .calendar-btn:hover { color: var(--accent); border-color: var(--accent-dim); }
    .calendar-btn.primary { color: var(--accent); border-color: var(--accent-dim); background: rgba(200,168,75,.08); }
    .calendar-grid {
      display: grid; grid-template-columns: repeat(7, minmax(120px, 1fr));
      border-left: 1px solid var(--border); border-top: 1px solid var(--border);
      background: var(--surface);
    }
    .calendar-weekday {
      padding: 9px 10px; border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border); color: var(--text-muted);
      font: 10px var(--font-mono); letter-spacing: .12em; text-transform: uppercase;
    }
    .calendar-day {
      min-height: 128px; padding: 8px; border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border); background: rgba(27,31,36,.3); overflow: hidden;
    }
    .calendar-day.outside { opacity: .36; }
    .calendar-day.today { box-shadow: inset 0 0 0 1px var(--accent-dim); }
    .calendar-day-number { display: block; margin-bottom: 7px; color: var(--text-dim); font: 11px var(--font-mono); }
    .calendar-day.today .calendar-day-number { color: var(--accent); font-weight: 700; }
    .calendar-event {
      display: block; margin: 0 0 5px; padding: 5px 6px;
      border-left: 2px solid var(--accent); background: rgba(200,168,75,.09);
      color: var(--text); font-size: 10px; line-height: 1.3; text-decoration: none;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .calendar-event:hover { background: rgba(200,168,75,.16); }
    .calendar-event-time { color: var(--accent); font-family: var(--font-mono); margin-right: 4px; }
    .calendar-connect {
      min-height: 460px; display: grid; place-items: center;
      border: 1px solid var(--border);
      background: linear-gradient(rgba(67,77,91,.14) 1px, transparent 1px),
        linear-gradient(90deg, rgba(67,77,91,.14) 1px, transparent 1px), var(--surface);
      background-size: 48px 48px;
    }
    .calendar-connect-card {
      max-width: 520px; padding: 34px; border: 1px solid var(--border-hi);
      background: var(--bg); text-align: center; box-shadow: 10px 10px 0 rgba(0,0,0,.18);
    }
    .calendar-connect-icon {
      width: 48px; height: 48px; margin: 0 auto 18px; display: grid;
      place-items: center; border: 1px solid var(--accent-dim); color: var(--accent);
      font: 700 16px var(--font-mono);
    }
    .calendar-connect-card h2 { margin-bottom: 8px; font: 700 15px var(--font-mono); letter-spacing: .12em; }
    .calendar-connect-card p { margin-bottom: 20px; color: var(--text-dim); font-size: 12px; }
    .calendar-message { padding: 28px; color: var(--text-dim); text-align: center; font: 11px var(--font-mono); letter-spacing: .08em; }

    /* ============================================================
       TOAST NOTIFICATION (in-page fallback)
    ============================================================ */
    #toast {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: var(--surface2);
      border: 1px solid var(--accent-dim);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 9px 18px;
      z-index: 300;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s, transform .2s;
      white-space: nowrap;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ============================================================
       RESPONSIVE
    ============================================================ */
    @media (max-width: 700px) {
      .panel-window {
        width: calc(100vw - 24px);
        max-height: calc(100vh - 80px);
      }
      .calendar-shell { overflow-x: auto; }
      .calendar-toolbar, .calendar-grid { min-width: 760px; }
    }
    @media (max-width: 540px) {
      #topbar { padding: 0 12px; gap: 8px; }
      #main { padding: 16px 12px 48px; }
      #search-wrap { max-width: 140px; }
      #btn-add-section .btn-text { display: none; }
      .topbar-btn .btn-label { display: none; }
    }
  </style>
</head>
<body>

  <!-- ===================== TOPBAR ===================== -->
  <header id="topbar">
    <button id="btn-linkboard" class="logo brand-link" onclick="openLinkboardHome()">LINKBOARD</button>
    <div class="brand-nav">
      <button id="btn-reminders" class="brand-link" onclick="openRemindersWindow()" title="Open reminders">REMINDERS <span id="reminder-badge" class="reminder-badge" style="display:none">0</span></button>
      <button id="btn-tasks" class="brand-link" onclick="openTasksWindow()" title="Open tasks">TASKS</button>
      <button id="btn-calendar" class="brand-link" onclick="openCalendarWindow()" title="Open Google Calendar">CALENDAR</button>
    </div>
    <div class="divider"></div>

    <!-- Search -->
    <div id="search-wrap">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="6.5" cy="6.5" r="4.5"/><line x1="10.5" y1="10.5" x2="14" y2="14"/>
      </svg>
      <input id="search" type="text" placeholder="search links..." autocomplete="off" />
    </div>

    <div class="spacer"></div>

    <!-- PWA INSTALL — shown when browser install prompt is available -->
    <button id="btn-install" class="topbar-btn" onclick="pwaInstall()" title="Install as desktop app">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M8 2v8M5 7l3 3 3-3"/><rect x="2" y="11" width="12" height="3" rx="1"/>
      </svg>
      <span class="btn-label">INSTALL APP</span>
    </button>

    <!-- NOTIFICATION PERMISSION -->
    <button id="btn-notif" class="topbar-btn" onclick="requestNotifPermission()" title="Enable desktop notifications">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M8 1a5 5 0 0 1 5 5v3l1.5 2.5H1.5L3 9V6a5 5 0 0 1 5-5z"/>
        <path d="M6.5 13.5a1.5 1.5 0 0 0 3 0"/>
      </svg>
      <span class="btn-label">NOTIFICATIONS</span>
    </button>

    <!-- Add Section -->
    <button id="btn-add-section" onclick="openAddSection()">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="8" y1="2" x2="8" y2="14"/><line x1="2" y1="8" x2="14" y2="8"/>
      </svg>
      <span class="btn-text">NEW SECTION</span>
    </button>
  </header>

  <!-- ===================== MAIN ===================== -->
  <main id="main">
    <!-- Empty state shown when no sections exist -->
    <div id="empty-state">
      <div class="es-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
          <rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/>
          <line x1="3" y1="9" x2="9" y2="9"/>
        </svg>
      </div>
      <h2>NO SECTIONS YET</h2>
      <p>Create your first section to start organising your links.</p>
      <button onclick="openAddSection()">+ ADD SECTION</button>
    </div>

    <!-- No search results -->
    <div id="no-results">NO MATCHES FOUND</div>

    <!-- Sections grid -->
    <div id="sections-grid"></div>

    <!-- Planner workspace -->
    <div id="planner-view"></div>
  </main>

  <!-- ===================== STATUS BAR ===================== -->
  <footer id="statusbar">
    <div class="statusbar-item">SECTIONS <span id="stat-sections">0</span></div>
    <div class="statusbar-item">LINKS <span id="stat-links">0</span></div>
    <div class="statusbar-item" style="margin-left:auto;" id="stat-push">PUSH: INACTIVE</div>
  </footer>

  <!-- ===================== REMINDERS PANEL ===================== -->
  <aside id="reminders-panel" role="complementary" aria-label="Reminders">
    <div class="rp-body">
      <div class="rp-empty">LEGACY PANEL</div>
    </div>
  </aside>

  <!-- ===================== TOAST ===================== -->
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- ===================== MODAL CONTAINER ===================== -->
  <div id="modal-container"></div>

  <!-- ===================== JAVASCRIPT ===================== -->
  <script>
    // ============================================================
    // DATA MODEL & PERSISTENCE
    // All data is stored in localStorage under the key "linkboard"
    // Structure: { sections: [ { id, title, links: [ { id, title, url } ] } ] }
    // ============================================================

    const STORAGE_KEY = 'linkboard';

    /** Load data from localStorage */
    function loadData() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || { sections: [] };
      } catch {
        return { sections: [] };
      }
    }

    /** Save data to localStorage and re-render */
    function saveData(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      render(data);
    }

    /** Generate a simple unique ID */
    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    }

    // ============================================================
    // FAVICON HELPER
    // Uses Google's favicon service as a fallback
    // ============================================================
    function faviconUrl(url) {
      try {
        const origin = new URL(url).origin;
        return `https://www.google.com/s2/favicons?sz=32&domain_url=${encodeURIComponent(origin)}`;
      } catch {
        return '';
      }
    }

    // ============================================================
    // RENDER ENGINE
    // Full re-render on every data change for simplicity
    // ============================================================
    function render(data) {
      const grid = document.getElementById('sections-grid');
      const plannerView = document.getElementById('planner-view');
      const emptyState = document.getElementById('empty-state');
      const noResults = document.getElementById('no-results');
      const query = document.getElementById('search').value.trim().toLowerCase();

      // Update status bar
      const totalLinks = data.sections.reduce((a, s) => a + s.links.length, 0);
      document.getElementById('stat-sections').textContent = data.sections.length;
      document.getElementById('stat-links').textContent = totalLinks;
      updateWorkspaceUI();

      if (_activeWorkspace === 'tasks') {
        renderPlannerView('tasks', query);
        emptyState.style.display = 'none';
        noResults.style.display = 'none';
        grid.style.display = 'none';
        plannerView.style.display = 'block';
        return;
      }

      if (_activeWorkspace === 'reminders') {
        renderPlannerView('reminders', query);
        emptyState.style.display = 'none';
        noResults.style.display = 'none';
        grid.style.display = 'none';
        plannerView.style.display = 'block';
        return;
      }

      if (_activeWorkspace === 'calendar') {
        renderCalendarView();
        emptyState.style.display = 'none';
        noResults.style.display = 'none';
        grid.style.display = 'none';
        plannerView.style.display = 'block';
        return;
      }

      plannerView.innerHTML = '';
      plannerView.style.display = 'none';
      grid.style.display = 'grid';

      // Show/hide empty state
      if (data.sections.length === 0) {
        emptyState.style.display = 'flex';
        noResults.style.display = 'none';
        grid.innerHTML = '';
        return;
      }
      emptyState.style.display = 'none';

      // Build HTML for each section
      grid.innerHTML = '';
      let anyVisible = false;

      data.sections.forEach((section, sIdx) => {
        // Filter links based on search query
        const visibleLinks = query
          ? section.links.filter(l =>
              l.title.toLowerCase().includes(query) ||
              l.url.toLowerCase().includes(query)
            )
          : section.links;

        // If searching, hide sections with no matching links
        if (query && visibleLinks.length === 0) return;
        anyVisible = true;

        const card = document.createElement('div');
        card.className = 'section-card';
        card.dataset.sectionId = section.id;
        card.draggable = true;

        // Section header
        card.innerHTML = `
          <div class="section-header" title="Drag to reorder">
            <span class="section-drag-handle">
              <svg width="10" height="14" viewBox="0 0 10 14" fill="currentColor">
                <circle cx="3" cy="2.5" r="1.2"/><circle cx="7" cy="2.5" r="1.2"/>
                <circle cx="3" cy="7" r="1.2"/><circle cx="7" cy="7" r="1.2"/>
                <circle cx="3" cy="11.5" r="1.2"/><circle cx="7" cy="11.5" r="1.2"/>
              </svg>
            </span>
            <span class="section-title" ondblclick="startRenameSection(this, '${escHtml(section.id)}')"
              title="Double-click to rename">${escHtml(section.title)}</span>
            <div class="section-actions">
              <button class="icon-btn" title="Rename section"
                onclick="openRenameSection('${escHtml(section.id)}')">
                <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M11 2l3 3-9 9H2v-3L11 2z"/>
                </svg>
              </button>
              <button class="icon-btn danger" title="Delete section"
                onclick="openDeleteSection('${escHtml(section.id)}')">
                <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">
                  <polyline points="2 4 14 4"/><path d="M5 4V2h6v2"/><path d="M6 7v5M10 7v5"/>
                  <rect x="3" y="4" width="10" height="10" rx="1"/>
                </svg>
              </button>
            </div>
          </div>
          <div class="links-list" data-section-id="${escHtml(section.id)}"></div>
          <button class="btn-add-link" onclick="openAddLink('${escHtml(section.id)}')">
            <svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="8" y1="2" x2="8" y2="14"/><line x1="2" y1="8" x2="14" y2="8"/>
            </svg>
            ADD LINK
          </button>
        `;

        // Build link tiles
        const linksList = card.querySelector('.links-list');
        visibleLinks.forEach((link, lIdx) => {
          const realIdx = section.links.indexOf(link); // actual index (matters when filtered)
          const tile = document.createElement('div');
          tile.className = 'link-tile';
          tile.draggable = true;
          tile.dataset.linkId = link.id;
          tile.dataset.sectionId = section.id;

          const favicon = faviconUrl(link.url);
          tile.innerHTML = `
            ${favicon
              ? `<img class="link-favicon" src="${escHtml(favicon)}" alt="" loading="lazy"
                   onerror="this.style.display='none'">`
              : ''
            }
            <a class="link-title" href="${escHtml(link.url)}" target="_blank" rel="noopener noreferrer"
               title="${escHtml(link.url)}">${escHtml(link.title)}</a>
            <div class="link-actions">
              <button class="icon-btn" title="Edit link"
                onclick="openEditLink('${escHtml(section.id)}','${escHtml(link.id)}')">
                <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M11 2l3 3-9 9H2v-3L11 2z"/>
                </svg>
              </button>
              <button class="icon-btn danger" title="Delete link"
                onclick="openDeleteLink('${escHtml(section.id)}','${escHtml(link.id)}')">
                <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">
                  <line x1="3" y1="3" x2="13" y2="13"/><line x1="13" y1="3" x2="3" y2="13"/>
                </svg>
              </button>
            </div>
          `;
          linksList.appendChild(tile);
        });

        grid.appendChild(card);
      });

      // Show "no results" if search found nothing
      noResults.style.display = (query && !anyVisible) ? 'block' : 'none';

      // Re-attach drag-and-drop listeners after render
      attachDragListeners();
    }

    /** Escape HTML special characters */
    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // ============================================================
    // MODAL SYSTEM
    // A single container that shows/hides modals
    // ============================================================

    function showModal(html) {
      const container = document.getElementById('modal-container');
      container.innerHTML = `<div class="modal-overlay" id="modal-overlay">${html}</div>`;
      // Close on overlay click
      container.querySelector('#modal-overlay').addEventListener('click', e => {
        if (e.target === e.currentTarget) closeModal();
      });
      // Focus first input
      const first = container.querySelector('input');
      if (first) { first.focus(); first.select(); }
    }

    function closeModal() {
      document.getElementById('modal-container').innerHTML = '';
    }

    // Close modal on Escape key
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeModal();
    });

    // ============================================================
    // SECTION CRUD
    // ============================================================

    /** Open "Add Section" modal */
    function openAddSection() {
      showModal(`
        <div class="modal">
          <h3>NEW SECTION</h3>
          <div class="form-field">
            <label>Section Title</label>
            <input id="input-section-title" type="text" placeholder="e.g. Development" maxlength="60"
              onkeydown="if(event.key==='Enter')confirmAddSection()" />
          </div>
          <div class="modal-actions">
            <button class="btn-cancel" onclick="closeModal()">CANCEL</button>
            <button class="btn-confirm" onclick="confirmAddSection()">CREATE</button>
          </div>
        </div>
      `);
    }

    function confirmAddSection() {
      const title = document.getElementById('input-section-title').value.trim();
      if (!title) return;
      const data = loadData();
      data.sections.push({ id: uid(), title, links: [] });
      saveData(data);
      closeModal();
    }

    /** Open "Rename Section" modal */
    function openRenameSection(sectionId) {
      const data = loadData();
      const section = data.sections.find(s => s.id === sectionId);
      if (!section) return;
      showModal(`
        <div class="modal">
          <h3>RENAME SECTION</h3>
          <div class="form-field">
            <label>Section Title</label>
            <input id="input-rename-section" type="text" value="${escHtml(section.title)}" maxlength="60"
              onkeydown="if(event.key==='Enter')confirmRenameSection('${escHtml(sectionId)}')" />
          </div>
          <div class="modal-actions">

    // DRAG AND DROP
    // HTML5 native drag-and-drop for sections and links
    // ============================================================

    let draggedSection = null;   // id of dragged section
    let draggedLink   = null;    // { sectionId, linkId }

    function attachDragListeners() {
      // --- SECTION DRAG ---
      document.querySelectorAll('.section-card').forEach(card => {
        card.addEventListener('dragstart', e => {
          // Only allow drag from the header area
          if (!e.target.closest('.section-header')) {
            e.preventDefault(); return;
          }
          draggedSection = card.dataset.sectionId;
          draggedLink = null;
          card.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
        });

        card.addEventListener('dragend', () => {
          draggedSection = null;
          document.querySelectorAll('.section-card').forEach(c => {
            c.classList.remove('dragging', 'drag-over');
          });
        });

        card.addEventListener('dragover', e => {
          if (!draggedSection || draggedSection === card.dataset.sectionId) return;
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          document.querySelectorAll('.section-card').forEach(c => c.classList.remove('drag-over'));
          card.classList.add('drag-over');
        });

        card.addEventListener('dragleave', e => {
          if (!e.currentTarget.contains(e.relatedTarget)) {
            card.classList.remove('drag-over');
          }
        });

        card.addEventListener('drop', e => {
          if (!draggedSection || draggedSection === card.dataset.sectionId) return;
          e.preventDefault();
          const data = loadData();
          const fromIdx = data.sections.findIndex(s => s.id === draggedSection);
          const toIdx   = data.sections.findIndex(s => s.id === card.dataset.sectionId);
          if (fromIdx < 0 || toIdx < 0) return;
          const [moved] = data.sections.splice(fromIdx, 1);
          data.sections.splice(toIdx, 0, moved);
          saveData(data);
        });
      });

      // --- LINK DRAG ---
      document.querySelectorAll('.link-tile').forEach(tile => {
        tile.addEventListener('dragstart', e => {
          e.stopPropagation(); // prevent section drag
          draggedLink = { sectionId: tile.dataset.sectionId, linkId: tile.dataset.linkId };
          draggedSection = null;
          tile.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
        });

        tile.addEventListener('dragend', () => {
          draggedLink = null;
          document.querySelectorAll('.link-tile').forEach(t => {
            t.classList.remove('dragging', 'drag-over-top', 'drag-over-bottom');
          });
        });

        tile.addEventListener('dragover', e => {
          if (!draggedLink) return;
          e.preventDefault();
          e.stopPropagation();
          e.dataTransfer.dropEffect = 'move';
          document.querySelectorAll('.link-tile').forEach(t =>
            t.classList.remove('drag-over-top', 'drag-over-bottom'));
          const rect = tile.getBoundingClientRect();
          const mid  = rect.top + rect.height / 2;
          tile.classList.add(e.clientY < mid ? 'drag-over-top' : 'drag-over-bottom');
        });

        tile.addEventListener('dragleave', () => {
          tile.classList.remove('drag-over-top', 'drag-over-bottom');
        });

        tile.addEventListener('drop', e => {
          if (!draggedLink) return;
          e.preventDefault();
          e.stopPropagation();
          const targetSectionId = tile.dataset.sectionId;
          const targetLinkId    = tile.dataset.linkId;
          if (draggedLink.linkId === targetLinkId) return;

          const data = loadData();
          const fromSection = data.sections.find(s => s.id === draggedLink.sectionId);
          const toSection   = data.sections.find(s => s.id === targetSectionId);
          if (!fromSection || !toSection) return;

          const fromIdx = fromSection.links.findIndex(l => l.id === draggedLink.linkId);
          const toIdx   = toSection.links.findIndex(l => l.id === targetLinkId);
          if (fromIdx < 0 || toIdx < 0) return;

          const [movedLink] = fromSection.links.splice(fromIdx, 1);

          // Insert before or after based on drop position
          const rect = tile.getBoundingClientRect();
          const insertAfter = e.clientY >= rect.top + rect.height / 2;
          const insertIdx = insertAfter ? toIdx + 1 : toIdx;

          if (fromSection === toSection) {
            // Same section — adjust index after removal
            const adjustedIdx = insertIdx > fromIdx ? insertIdx - 1 : insertIdx;
            fromSection.links.splice(adjustedIdx, 0, movedLink);
          } else {
            toSection.links.splice(insertIdx, 0, movedLink);
          }
          saveData(data);
        });
      });

      // Allow dropping links onto an empty links-list
      document.querySelectorAll('.links-list').forEach(list => {
        list.addEventListener('dragover', e => {
          if (!draggedLink) return;
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
        });
        list.addEventListener('drop', e => {
          if (!draggedLink) return;
          // Only handle if dropped directly on the list (not on a tile)
          if (e.target !== list) return;
          e.preventDefault();
          const targetSectionId = list.dataset.sectionId;
          const data = loadData();
          const fromSection = data.sections.find(s => s.id === draggedLink.sectionId);
          const toSection   = data.sections.find(s => s.id === targetSectionId);
          if (!fromSection || !toSection) return;
          const fromIdx = fromSection.links.findIndex(l => l.id === draggedLink.linkId);
          if (fromIdx < 0) return;
          const [movedLink] = fromSection.links.splice(fromIdx, 1);
          toSection.links.push(movedLink);
          saveData(data);
        });
      });
    }

    // ============================================================
    // WEB PUSH — VAPID subscription flow
    // 1. Fetch the VAPID public key from /api/push/send
    // 2. Request notification permission
    // 3. Subscribe via pushManager.subscribe()
    // 4. POST the subscription to /api/push/subscribe
    // The backend stores subscriptions and cron triggers delivery later.
    // ============================================================

    let _pushSubscription = null; // current PushSubscription object
    let _activeWorkspace = 'linkboard';
    let _composerWindow = null;
    let _deviceId = null;
    let _todos = [];
    let _todosError = null;
    let _reminders = [];
    let _remindersError = null;
    let _calendarStatus = null;
    let _calendarEvents = [];
    let _calendarError = null;
    let _calendarNotice = null;
    let _calendarMonth = new Date();

    function getDeviceId() {
      if (_deviceId) return _deviceId;
      try {
        const existing = localStorage.getItem('linkboard_device_id');
        if (existing) {
          _deviceId = existing;
          return _deviceId;
        }

        const created = (crypto && crypto.randomUUID)
          ? crypto.randomUUID()
          : `lb_${Date.now().toString(36)}${Math.random().toString(36).slice(2, 10)}`;
        localStorage.setItem('linkboard_device_id', created);
        _deviceId = created;
        return _deviceId;
      } catch {
        _deviceId = `lb_fallback_${Date.now().toString(36)}`;
        return _deviceId;
      }
    }

    function normalizeApiError(error, fallback) {
      const message =
        error && typeof error.message === 'string' ? error.message.trim() : '';

      if (!message) {
        return fallback;
      }

      if (
        message.includes('device_id') ||
        message.includes('null value in column "user_id"') ||
        message.includes('Could not find the') ||
        message.includes('column')
      ) {
        return 'Database schema outdated. Run the local device mode SQL in Supabase.';
      }

      return message;
    }

    /** Convert a base64url VAPID public key to a Uint8Array */
    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
      const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      const raw = atob(base64);
      return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
    }

    /** Fetch VAPID public key from server */
    async function getVapidPublicKey() {
      try {
        const res = await fetch('/api/push/send');
        if (!res.ok) return null;
        const { publicKey } = await res.json();
        return publicKey || null;
      } catch {
        return null;
      }
    }

    /** Subscribe to Web Push and register with server */
    async function subscribeToPush() {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
        showToast('Web Push is not supported in this browser.');
        return false;
      }

      // Request notification permission first
      const permission = await Notification.requestPermission();
      if (permission !== 'granted') {
        showToast('Notification permission denied.');
        updateNotifBtn();
        return false;
      }

      const vapidPublicKey = await getVapidPublicKey();
      if (!vapidPublicKey) {
        // Reminders require server-side Web Push configuration.
        showToast('Push notifications are not configured on the server.');
        updateNotifBtn();
        return false;
      }

      try {
        const swReg = await navigator.serviceWorker.ready;
        const subscription = await swReg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(vapidPublicKey)
        });

        // Register subscription with our Next.js API
        const subRes = await fetch('/api/push/subscribe', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-device-id': getDeviceId()
          },
          body: JSON.stringify({ subscription: subscription.toJSON() })
        });
        const subData = await subRes.json();
        console.log('[push] subscription registered:', subData);

        _pushSubscription = subscription;
        showToast('Web Push notifications enabled.');
        updateNotifBtn();
        return true;
      } catch (err) {
        console.error('[push] subscribe failed:', err);
        showToast('Could not subscribe to push notifications.');
        return false;
      }
    }

    /** Restore existing push subscription on page load and re-register with server. */
    async function restorePushSubscription() {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
      try {
        const swReg = await navigator.serviceWorker.ready;
        const existing = await swReg.pushManager.getSubscription();
        if (existing) {
          _pushSubscription = existing;
          // Re-register on load so the stored keys stay in sync.
          const res = await fetch('/api/push/subscribe', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'x-device-id': getDeviceId()
            },
            body: JSON.stringify({ subscription: existing.toJSON() })
          });
          const data = await res.json();
          console.log('[push] subscription re-registered on load:', data);
        }
      } catch (err) {
        console.log('[push] restorePushSubscription error:', err);
      }
      updateNotifBtn();
    }

    function requestNotifPermission() {
      subscribeToPush();

    // ============================================================
    // REMINDER SYSTEM
    // Reminders are stored in Supabase and processed by backend cron.
    // ============================================================

    async function apiJson(url, options = {}) {
      const headers = new Headers(options.headers || {});
      headers.set('x-device-id', getDeviceId());

      const response = await fetch(url, {
        ...options,
        cache: 'no-store',
        headers,
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        const err = new Error(data.error || 'Request failed');
        err.status = response.status;
        throw err;
      }
      return data;
    }

    async function loadReminders({ silent = false } = {}) {
      const [todosResult, remindersResult] = await Promise.allSettled([
        apiJson('/api/todos'),
        apiJson('/api/tasks')
      ]);

      if (todosResult.status === 'fulfilled') {
        _todos = Array.isArray(todosResult.value.todos) ? todosResult.value.todos : [];
        _todosError = null;
      } else {
        _todos = [];
        _todosError = normalizeApiError(todosResult.reason, 'Could not load tasks.').toUpperCase();
      }

      if (remindersResult.status === 'fulfilled') {
        _reminders = Array.isArray(remindersResult.value.tasks) ? remindersResult.value.tasks : [];
        _remindersError = null;
      } else {
        _reminders = [];
        _remindersError = normalizeApiError(remindersResult.reason, 'Could not load reminders.').toUpperCase();
      }

      renderReminders();
      render(loadData());

      if (!silent && (_todosError || _remindersError)) {
        showToast(_todosError || _remindersError || 'Could not load the planner.');
      }
    }

    async function addTask() {
      const title = document.getElementById('task-title').value.trim();
      if (!title) {
        showToast('Task title is required.');
        return;

      try {
        const result = await apiJson('/api/todos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            title
          })
        });

        if (result && result.todo) {
          _todos = [result.todo, ..._todos.filter(item => item.id !== result.todo.id)];
        }

        document.getElementById('task-title').value = '';
        _composerWindow = null;
        render(loadData());
        await loadReminders({ silent: true });
        showToast('Task saved.');
      } catch (err) {
        showToast(normalizeApiError(err, 'Could not save task.'));
      }
    }

    async function addReminder() {
      const title = document.getElementById('rp-title').value.trim();
      const time  = document.getElementById('rp-time').value;
      if (!title || !time) {
        showToast('Title and date/time are required.');
        return;
      }

      const dueDate = new Date(time);
      if (Number.isNaN(dueDate.getTime())) {
        showToast('Invalid reminder date/time.');
        return;
      }

      try {
        const result = await apiJson('/api/tasks', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            title,
            dueDate: dueDate.toISOString()
          })
        });

        if (result && result.task) {
          _reminders = [..._reminders.filter(item => item.id !== result.task.id), result.task]
            .sort((a, b) => new Date(a.due_date) - new Date(b.due_date));
        }

        document.getElementById('rp-title').value = '';
        document.getElementById('rp-time').value  = '';
        _composerWindow = null;
        render(loadData());
        await loadReminders({ silent: true });
        showToast('Reminder saved.');
      } catch (err) {
        showToast(normalizeApiError(err, 'Could not save reminder.'));
      }
    }

      }
    }

    async function completeTask(id) {
      await deleteTask(id, 'Task completed.');
    }

    function renderReminders() {
      const badge = document.getElementById('reminder-badge');

      const pending = _reminders.filter(r => !r.notified).length;
      if (pending > 0) {
        badge.textContent = pending;
        badge.style.display = 'inline-flex';
      } else {
        badge.style.display = 'none';
      }
    }

    function getTasksMarkup(items = _todos, emptyMessage = 'NO TASKS') {
      if (_todosError) {
        return `<div class="rp-empty">${_todosError}</div>`;
      }

      if (items.length === 0) {
        return `<div class="rp-empty">${emptyMessage}</div>`;
      }

      return items.map(t => `
        <div class="planner-row">
          <div class="planner-row-main">
            <input
              class="planner-task-check"
              type="checkbox"
              title="Mark task as done"
              aria-label="Mark task as done"
              onchange="completeTask('${escHtml(t.id)}')"
            />
            <span class="planner-row-title">${escHtml(t.title)}</span>
          </div>
        </div>
      `).join('');
    }

    function getRemindersMarkup(items = _reminders, emptyMessage = 'NO REMINDERS') {
      if (_remindersError) {
        return `<div class="rp-empty">${_remindersError}</div>`;
      }

      const sortedReminders = [...items].sort((a, b) => {
        if (a.notified !== b.notified) return a.notified ? 1 : -1;
        return new Date(a.due_date) - new Date(b.due_date);
      });

      if (sortedReminders.length === 0) {
        return `<div class="rp-empty">${emptyMessage}</div>`;
      }

      return sortedReminders.map(r => {
        const dt = new Date(r.due_date);
        const today = new Date();
        const isToday = dt.toDateString() === today.toDateString();
        const datePart = isToday
          ? 'Today'
          : dt.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: dt.getFullYear() !== today.getFullYear() ? 'numeric' : undefined });
        const timePart = dt.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
        const dueText = `${datePart} at ${timePart}`;
        return `
          <div class="planner-row${r.notified ? ' reminder-item fired' : ''}">
            <div class="planner-row-main">
              <svg class="planner-row-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M12 3a4.5 4.5 0 0 0-4.5 4.5v2.2c0 .74-.22 1.46-.63 2.07L5.2 14.5c-.42.63.03 1.5.78 1.5h12.04c.75 0 1.2-.87.78-1.5l-1.67-2.73a3.9 3.9 0 0 1-.63-2.07V7.5A4.5 4.5 0 0 0 12 3Zm0 18a2.24 2.24 0 0 0 2.12-1.5H9.88A2.24 2.24 0 0 0 12 21Z"/>
              </svg>
              <span class="planner-row-title">${escHtml(r.title)}</span>
            </div>
            <span class="planner-row-meta">${escHtml(dueText)}</span>
            <button class="planner-row-delete" title="Delete reminder"
              onclick="deleteReminder('${escHtml(r.id)}')">
              <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <line x1="3" y1="3" x2="13" y2="13"/><line x1="13" y1="3" x2="3" y2="13"/>
              </svg>
            </button>
          </div>
          ${r.description ? `
            <div class="planner-row" style="min-height:40px;padding-top:0;padding-bottom:12px;border-top:none;">
              <div class="planner-row-main" style="padding-left:32px;">
                <span class="reminder-desc">${escHtml(r.description)}</span>
              </div>
            </div>
          ` : ''}
        `;
      }).join('');
    }

    function openTaskComposer() {
      _composerWindow = 'tasks';
      render(loadData());
    }

    function openReminderComposer() {
      _composerWindow = 'reminders';
      render(loadData());
    }

    function closeComposer() {
      _composerWindow = null;
      render(loadData());
    }

    function renderPlannerView(view, query) {
      const plannerView = document.getElementById('planner-view');
      const source = view === 'tasks' ? _todos : _reminders;
      const filtered = query
        ? source.filter(item => {
            const haystack = [
              item.title,
              item.description || '',
              view === 'reminders' ? new Date(item.due_date).toLocaleString() : ''
            ].join(' ').toLowerCase();
            return haystack.includes(query);
          })
        : source;

      const isComposerOpen = _composerWindow === view;
      const title = view === 'tasks' ? 'TASKS' : 'REMINDERS';
      const createLabel = view === 'tasks' ? 'Create New Task' : 'Create New Reminder';
      const emptyTitle = view === 'tasks' ? 'NO TASKS YET' : 'NO REMINDERS YET';
      const emptyBody = view === 'tasks'
        ? 'Add a simple task and mark it done when you finish it.'
        : 'Add a reminder with a due date and the backend will handle the notification.';

      const bodyMarkup = isComposerOpen
        ? (view === 'tasks'
          ? `
            <div class="planner-form">
              <div class="planner-form-title">NEW TASK</div>
              <input class="rp-input" id="task-title" type="text" placeholder="Title" maxlength="80" />
              <div class="planner-form-actions">
                <button class="rp-add-btn" onclick="addTask()">+ ADD TASK</button>
                <button class="window-create-btn secondary" onclick="closeComposer()">CANCEL</button>
              </div>
            </div>
          `
          : `
            <div class="planner-form">
              <div class="planner-form-title">NEW REMINDER</div>
              <input class="rp-input" id="rp-title" type="text" placeholder="Title" maxlength="80" />
              <input class="rp-input" id="rp-time" type="datetime-local" />
              <div class="planner-form-actions">
                <button class="rp-add-btn" onclick="addReminder()">+ ADD REMINDER</button>
                <button class="window-create-btn secondary" onclick="closeComposer()">CANCEL</button>
              </div>
            </div>
          `)
        : (filtered.length === 0 && !query && !((view === 'tasks' && _todosError) || (view === 'reminders' && _remindersError))
          ? `
            <div class="planner-empty">
              <strong>${emptyTitle}</strong>
              <div>${emptyBody}</div>
              <button class="window-create-btn" onclick="${view === 'tasks' ? 'openTaskComposer()' : 'openReminderComposer()'}">+ ${createLabel}</button>
            </div>
          `
          : `<div class="planner-list">${view === 'tasks'
              ? getTasksMarkup(filtered, query ? 'NO MATCHING TASKS' : 'NO TASKS')
              : getRemindersMarkup(filtered, query ? 'NO MATCHING REMINDERS' : 'NO REMINDERS')
            }</div>`);

      plannerView.innerHTML = `
        <div class="planner-shell">
          <div class="planner-card section-card">
            <div class="section-header">
              <span class="section-title">${title}</span>
              <div class="section-actions">
                <button class="window-create-btn${isComposerOpen ? ' secondary' : ''}" onclick="${isComposerOpen ? 'closeComposer()' : (view === 'tasks' ? 'openTaskComposer()' : 'openReminderComposer()')}">
                  ${isComposerOpen ? 'Back to List' : `+ ${createLabel}`}
                </button>
              </div>
            </div>
            <div class="panel-window-body" style="padding:0;gap:0;min-height:0;">${bodyMarkup}</div>
          </div>
        </div>
      `;
    }

    function openTasksWindow() {
      setWorkspace('tasks');
    }

    function openRemindersWindow() {
      setWorkspace('reminders');
    }

    function openCalendarWindow() {
      setWorkspace('calendar');
      loadCalendar();
    }

    function calendarRange(month) {
      const first = new Date(month.getFullYear(), month.getMonth(), 1);
      const start = new Date(first);
      start.setDate(first.getDate() - first.getDay());
      const end = new Date(start);
      end.setDate(start.getDate() + 42);
      return { start, end };
    }

    async function loadCalendar() {
      _calendarError = null;
      render(loadData());
      try {
        const statusResponse = await fetch('/api/google-calendar/status', { cache: 'no-store' });
        _calendarStatus = await statusResponse.json();
        if (_calendarStatus.connected) {
          const range = calendarRange(_calendarMonth);
          const params = new URLSearchParams({
            from: range.start.toISOString(),
            to: range.end.toISOString()
          });
          const eventsResponse = await fetch(`/api/google-calendar/events?${params}`, { cache: 'no-store' });
          const data = await eventsResponse.json();
          if (!eventsResponse.ok) throw new Error(data.error || 'Could not load calendar');
          _calendarEvents = data.events || [];
        }
      } catch (error) {
        _calendarError = error.message || 'Could not load calendar';
      }
      render(loadData());
    }

    function changeCalendarMonth(delta) {
      _calendarMonth = new Date(_calendarMonth.getFullYear(), _calendarMonth.getMonth() + delta, 1);
      loadCalendar();
    }

    function goCalendarToday() {
      _calendarMonth = new Date();
      loadCalendar();
    }

    async function disconnectCalendar() {
      await fetch('/api/google-calendar/disconnect', { method: 'POST' });
      _calendarStatus = { connected: false, configured: true };
      _calendarEvents = [];
      render(loadData());
    }

    function renderCalendarView() {
      const plannerView = document.getElementById('planner-view');
      if (!_calendarStatus) {
        plannerView.innerHTML = '<div class="calendar-message">CHECKING GOOGLE CALENDAR...</div>';
        return;
      }

      if (!_calendarStatus.connected) {
        const detail = _calendarNotice || (_calendarStatus.configured === false
          ? 'Google OAuth credentials are pending in the deployment configuration.'
          : 'Authorize the corporate account to show its events securely inside Linkboard.');
        plannerView.innerHTML = `
          <div class="calendar-shell">
            <div class="calendar-connect">
              <div class="calendar-connect-card">
                <div class="calendar-connect-icon">31</div>
                <h2>CONNECT GOOGLE CALENDAR</h2>
                <p>${escHtml(detail)}<br><strong>miqueas.elias@allaria.com.ar</strong></p>
                <a class="calendar-btn primary" href="/api/google-calendar/auth">CONNECT ACCOUNT</a>
              </div>
            </div>
          </div>`;
        return;
      }

      const month = _calendarMonth.getMonth();
      const range = calendarRange(_calendarMonth);
      const weekdays = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
      const monthLabel = new Intl.DateTimeFormat('en-US', { month: 'long', year: 'numeric' }).format(_calendarMonth);
      const query = document.getElementById('search').value.trim().toLowerCase();
      const events = _calendarEvents.filter(event => !query || event.title.toLowerCase().includes(query));
      let daysMarkup = weekdays.map(day => `<div class="calendar-weekday">${day}</div>`).join('');

      for (let index = 0; index < 42; index++) {
        const date = new Date(range.start);
        date.setDate(range.start.getDate() + index);
        const key = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
        const isToday = date.toDateString() === new Date().toDateString();
        const dayEvents = events.filter(event => String(event.start).slice(0, 10) === key);
        const eventMarkup = dayEvents.map(event => {
          const time = event.allDay ? 'ALL DAY' : new Intl.DateTimeFormat('en-US', {
            hour: '2-digit', minute: '2-digit', hour12: false
          }).format(new Date(event.start));
          return `<a class="calendar-event" href="${escHtml(event.htmlLink || '#')}" target="_blank" rel="noopener noreferrer" title="${escHtml(event.title)}">
            <span class="calendar-event-time">${time}</span>${escHtml(event.title)}
          </a>`;
        }).join('');
        daysMarkup += `<div class="calendar-day${date.getMonth() !== month ? ' outside' : ''}${isToday ? ' today' : ''}">
          <span class="calendar-day-number">${date.getDate()}</span>${eventMarkup}
        </div>`;
      }

      plannerView.innerHTML = `
        <div class="calendar-shell">
          <div class="calendar-toolbar">
            <button class="calendar-btn" onclick="changeCalendarMonth(-1)" aria-label="Previous month">&larr;</button>
            <button class="calendar-btn" onclick="goCalendarToday()">TODAY</button>
            <button class="calendar-btn" onclick="changeCalendarMonth(1)" aria-label="Next month">&rarr;</button>
            <h2 class="calendar-title">${escHtml(monthLabel)}</h2>
            <span class="calendar-account">${escHtml(_calendarStatus.email || 'miqueas.elias@allaria.com.ar')}</span>
            <button class="calendar-btn" onclick="disconnectCalendar()">DISCONNECT</button>
          </div>
          ${_calendarError ? `<div class="calendar-message">${escHtml(_calendarError)}</div>` : `<div class="calendar-grid">${daysMarkup}</div>`}
        </div>`;
    }

    function renderActiveToolWindow() {
      render(loadData());
    }

    function toggleRemindersPanel() {
      openRemindersWindow();
    }

    // ============================================================
    // TOAST
    // Lightweight in-page feedback message.
    // ============================================================

    let _toastTimer = null;

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(_toastTimer);
      _toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // ============================================================
    // INIT REMINDERS ON LOAD
    // ============================================================
    const calendarParams = new URLSearchParams(window.location.search);
    if (calendarParams.has('calendar_connected') || calendarParams.has('calendar_error')) {
      _activeWorkspace = 'calendar';
      if (calendarParams.get('calendar_error') === 'wrong_account') {
        _calendarNotice = 'Use miqueas.elias@allaria.com.ar to connect this calendar.';
      }
      loadCalendar();
      history.replaceState({}, '', '/dashboard.html?v=20260727c');
    }
    render(loadData());
    renderReminders();
    loadReminders({ silent: true });
  </script>
</body>
</html>
